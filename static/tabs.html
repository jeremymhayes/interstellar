<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" id="tab-favicon" href="data:," />
    <title id="t">Browser</title>
    <link rel="stylesheet" href="/assets/css/global.css?v=7" />
    <link rel="stylesheet" href="/assets/css/t.css?v=3" />
  </head>
  <body>
    <nav class="nav" id="right-side-nav" aria-label="Tabs">
      <ul id="tab-list"></ul>
      <button type="button" aria-label="Add tab" title="Add tab" id="add-tab">+</button>
    </nav>
    <div class="nav-bar">
      <div class="nav-container">
        <div class="nav-left">
          <button type="button" title="Home" id="home-page" class="nav-button">Home</button>
          <button type="button" title="Back" class="nav-button" onclick="goBack()" aria-label="Back">←</button>
          <button type="button" title="Forward" class="nav-button" onclick="goForward()" aria-label="Forward">→</button>
          <button type="button" title="Reload" onclick="reload()" class="nav-button" aria-label="Reload">↻</button>
          <form id="fv" class="navpost" method="post" role="search">
            <label class="sr-only" for="input">Search or enter a URL</label>
            <input id="input" class="bar" placeholder="Search or enter a URL" type="text" autocomplete="off" />
          </form>
        </div>
        <div class="nav-right">
          <button type="button" title="Fullscreen" id="fullscreen-button" class="nav-button">Fullscreen</button>
          <button type="button" title="Pop out" id="popout-button" class="nav-button" onclick="popout()">Pop out</button>
          <button type="button" title="Inspect" class="nav-button" onclick="eToggle()">Inspect</button>
          <button type="button" title="Hide tabs" id="tabs-button" class="nav-button">Hide tabs</button>
        </div>
      </div>
    </div>
    <div class="frame-container" id="frame-container"></div>
